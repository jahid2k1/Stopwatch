<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gym Clock</title>
  <meta name="theme-color" content="#ffffff" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="manifest.json">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }body {
  transition: background 0.25s ease, color 0.25s ease, opacity 0.35s ease;
  margin: 0;
  background: white;
  color: black;
  font-family: Arial, Helvetica, sans-serif;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  width: 100%;
  min-height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  padding: 18px 28px;
}

.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  font-size: 2rem;
  font-weight: 700;
}

.session,
.small-clock {
  letter-spacing: 1px;
}

.main-clock-wrapper {
  flex: 1;
  min-height: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  transform: translateY(-4vh);
  width: 100%;
}

.main-clock {
  display: flex;
  align-items: baseline;
  justify-content: center;
  font-weight: bold;
  line-height: 1;
}

.big-time {
  font-size: min(28vw, 220px);
  letter-spacing: 4px;
}

.seconds {
  font-size: min(10vw, 80px);
  margin-left: 12px;
  opacity: 0.8;
}

.fullscreen-btn {
  position: fixed;
  right: 18px;
  bottom: 56px;
  width: 46px;
  height: 46px;
  border: none;
  border-radius: 50%;
  background: rgba(0,0,0,0.08);
  color: black;
  font-size: 1.2rem;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(4px);
}

.fullscreen-btn.hidden {
  opacity: 0;
  pointer-events: none;
}

.bottom-info {
  position: fixed;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  text-align: center;
  font-size: 1.1rem;
  opacity: 0.7;
  z-index: 10;
  pointer-events: none;
}

@media (orientation: portrait) {
  .top-bar {
    font-size: 1.2rem;
  }

  .big-time {
    font-size: 24vw;
  }

  .seconds {
    font-size: 9vw;
  }

  .bottom-info {
    font-size: 0.9rem;
  }
}
}

  </style>
</head>
<body>
  <div class="container" id="touchArea">
    <div class="top-bar">
      <div class="session" id="sessionTime">00:00</div>
      <div class="small-clock" id="smallClock">00:00</div>
    </div><div class="main-clock-wrapper">
  <div class="main-clock">
    <div class="big-time" id="mainTime">00:00</div>
    <div class="seconds" id="seconds">00</div>
  </div>
</div>

<button class="fullscreen-btn" id="fullscreenBtn">⛶</button>

<div class="bottom-info">
  Tap = Start/Pause • Hold = Reset
</div>

  </div>  <script>
    const mainTime = document.getElementById('mainTime');
    const secondsText = document.getElementById('seconds');
    const smallClock = document.getElementById('smallClock');
    const sessionTime = document.getElementById('sessionTime');
    const touchArea = document.getElementById('touchArea');
    const fullscreenBtn = document.getElementById('fullscreenBtn');

    let deferredPrompt = null;

    let running = false;
    let elapsedMs = 0;
    let lastTick = Date.now();
    let holdTimer = null;
    let holding = false;

    function format(num) {
      return String(num).padStart(2, '0');
    }

    function updateMainClock() {
      const now = new Date();

      const hours24 = now.getHours();
      const hh12 = hours24 % 12 || 12;
      const mm = format(now.getMinutes());
      const ampm = hours24 >= 12 ? 'PM' : 'AM';

      const totalCentiseconds = Math.floor(elapsedMs / 10);
      const totalSeconds = Math.floor(totalCentiseconds / 100);
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      const centiseconds = totalCentiseconds % 100;

      mainTime.textContent = `${format(minutes)}:${format(seconds)}`;
      secondsText.textContent = format(centiseconds);

      smallClock.textContent = `${format(hh12)}:${mm} ${ampm}`;
    }

    let sessionStart = Date.now();

    function updateSessionClock() {
      const sessionElapsed = Date.now() - sessionStart;
      const totalSeconds = Math.floor(sessionElapsed / 1000);
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      if (hours > 0) {
        sessionTime.textContent = `${format(hours)}:${format(minutes)}:${format(seconds)}`;
      } else {
        sessionTime.textContent = `${format(minutes)}:${format(seconds)}`;
      }
    }

    function tick() {
      const now = Date.now();

      if (running) {
        elapsedMs += now - lastTick;
      }

      lastTick = now;

      updateMainClock();
      updateSessionClock();

      requestAnimationFrame(tick);
    }

    function togglePauseResume() {
      running = !running;
      lastTick = Date.now();

      document.body.style.transition = 'none';
      document.body.style.background = 'black';
      document.body.style.color = 'white';

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          document.body.style.transition = 'background 0.35s ease, color 0.35s ease';
          document.body.style.background = 'white';
          document.body.style.color = 'black';
        });
      });

      if (navigator.vibrate) {
        navigator.vibrate(40);
      }
    }

    function resetSession() {
      elapsedMs = 0;
      running = false;
      lastTick = Date.now();
      updateSessionClock();

      document.body.style.transition = 'opacity 0.45s ease';
      document.body.style.opacity = '0';

      setTimeout(() => {
        document.body.style.opacity = '1';
      }, 60);

      if (navigator.vibrate) {
        navigator.vibrate(180);
      }
    }

    document.querySelector('.main-clock-wrapper').addEventListener('pointerdown', () => {
      holding = false;

      holdTimer = setTimeout(() => {
        holding = true;
        resetSession();
      }, 700);
    });

    document.querySelector('.main-clock-wrapper').addEventListener('pointerup', () => {
      clearTimeout(holdTimer);

      if (!holding) {
        togglePauseResume();
      }
    });

    document.querySelector('.main-clock-wrapper').addEventListener('pointerleave', () => {
      clearTimeout(holdTimer);
    });

    fullscreenBtn.addEventListener('click', async (e) => {
      e.stopPropagation();

      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
          fullscreenBtn.classList.add('hidden');
        }
      } catch (e) {
        console.log('Fullscreen failed');
      }
    });

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) {
        fullscreenBtn.classList.remove('hidden');
      }
    });

    const manifest = {
      name: 'Gym Stopwatch',
      short_name: 'GymTimer',
      display: 'standalone',
      background_color: '#ffffff',
      theme_color: '#ffffff',
      start_url: '.',
      orientation: 'any'
    };

    const manifestBlob = new Blob([
      JSON.stringify(manifest)
    ], { type: 'application/json' });

    const manifestURL = URL.createObjectURL(manifestBlob);

    const manifestLink = document.createElement('link');
    manifestLink.rel = 'manifest';
    manifestLink.href = manifestURL;
    document.head.appendChild(manifestLink);

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    updateMainClock();
    updateSessionClock();
    tick();
    if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}
  </script></body>
</html>
